[project]
name = "unisonlabs"
version = "0.1.0"
description = "The official Python SDK for the Unison brain API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Unison Labs", email = "hello@unisonlabs.ai" },
]
requires-python = ">=3.9"
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.23.0,<1",
    "pydantic>=2.0.0,<3",
    "typing-extensions>=4.7,<5",
    "anyio>=3.5.0,<5",
]

[project.urls]
Homepage = "https://github.com/unison-labs-ai/python-sdk"
Repository = "https://github.com/unison-labs-ai/python-sdk"
Documentation = "https://docs.unisonlabs.ai"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.4",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unisonlabs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["I", "F401", "E722", "B"]
ignore = ["B006"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["unisonlabs", "tests"]

[tool.mypy]
python_version = "3.9"
strict = true
implicit_reexport = true
